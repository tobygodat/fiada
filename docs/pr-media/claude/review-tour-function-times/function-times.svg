<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="Literata, Georgia, serif" font-size="14">
  <rect width="720" height="250" fill="#f6f1e7"/>
  <text x="24" y="32" fill="#2b2620" font-weight="600">crud.py, three edits by one agent</text>
  <g fill="#6b6257">
    <text x="210" y="62">10:00 adds items_by_priority</text>
    <text x="210" y="80">(you read it)</text>
    <text x="420" y="62">10:05 edits create_item</text>
  </g>
  <line x1="200" y1="92" x2="690" y2="92" stroke="#c9bfae"/>
  <text x="24" y="128" fill="#2b2620">before: file's time</text>
  <text x="24" y="146" fill="#6b6257">items_by_priority</text>
  <circle cx="230" cy="138" r="5" fill="#2b2620"/>
  <circle cx="440" cy="138" r="5" fill="#a5452f"/>
  <text x="456" y="143" fill="#a5452f">10:05, unread again</text>
  <text x="24" y="196" fill="#2b2620">after: its own time</text>
  <text x="24" y="214" fill="#6b6257">items_by_priority</text>
  <circle cx="230" cy="206" r="5" fill="#2b2620"/>
  <circle cx="440" cy="206" r="5" fill="none" stroke="#3d7a52" stroke-width="2"/>
  <text x="456" y="211" fill="#3d7a52">still 10:00, stays read</text>
  <text x="456" y="232" fill="#6b6257">create_item 10:05, new to read</text>
</svg>
