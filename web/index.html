<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strata</title>
    <!-- Three strata on dark paper, the lowest in the one green. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1a19'/%3E%3Cpath d='M7 10h18M7 16h18' stroke='%23e8e5df' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M7 22h18' stroke='%238fd18a' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The design system's type: Literata with its optical-size axis, and IBM Plex Mono for quoted code only. -->
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
    <!-- Restores the theme before first paint so nothing flashes: the one chosen in the sidebar,
         else the system's. useTheme.ts keeps it in step after that. -->
    <script>
      try {
        const saved = localStorage.getItem('strata-theme');
        const light = saved ? saved === 'light' : matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      } catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
