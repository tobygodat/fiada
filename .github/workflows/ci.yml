# Typecheck, lint, test and build on every pull request and every push to
# main: the same commands AGENTS.md asks for before a merge, each in its own
# job so they run side by side and the run takes as long as the slowest one.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One failure doesn't cancel the others, so a run reports all of them.
      fail-fast: false
      matrix:
        task: [typecheck, lint, test, build]
    steps:
      - uses: actions/checkout@v5

      # bun installs and runs the scripts; Node runs the indexer, agent and tests.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.task }}
